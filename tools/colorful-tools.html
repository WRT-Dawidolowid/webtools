<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorful Tools - Infinite Edition</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --glass: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.2);
    --accent: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
    --green-flash: rgba(144, 238, 144, 0.4);
    --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

body {
    font-family: "Outfit", sans-serif;
    background: var(--bg-gradient);
    color: white;
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
}

/* Base resettings */
a { text-decoration: none; }
input, button, select { font-family: "Outfit", sans-serif; }

/* Animations */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes flashGreen { 0% { background: var(--green-flash); } 100% { background: rgba(255,255,255,0.06); } }
@keyframes flashBorder { 0% { border-color: #90ee90; } 100% { border-color: var(--glass-border); } }
.animate-in { animation: fadeInUp 0.5s ease forwards; }
.flash-copy { animation: flashGreen 0.4s ease; }
.flash-border { animation: flashBorder 0.4s ease; }

/* Container */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 35px;
    backdrop-filter: blur(25px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    border: 1px solid var(--glass-border);
}

/* --- HEADER --- */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
.header h1 { margin: 0; font-size: 2.2em; letter-spacing: -1px; display: flex; align-items: center; gap: 10px; }
.version-tag { font-size: 0.4em; opacity: 0.7; font-weight: 600; background: rgba(255,255,255,0.15); padding: 3px 10px; border-radius: 7px; color: #ffd89b; margin-left: 5px; }
.credits { margin: 5px 0 0 0; font-size: 0.9em; opacity: 0.5; font-weight: 400; }

/* Buttons & Inputs */
.btn-main { padding: 12px 25px; background: var(--accent); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; justify-content: center; }
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); filter: brightness(1.1); }

.btn-outline { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: white; padding: 12px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
.btn-outline:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

.icon-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); width: 45px; height: 45px; border-radius: 10px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 1.1em; }
.icon-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

.main-input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: white; outline: none; font-size: 16px; font-weight: 600; box-sizing: border-box; transition: 0.3s; }
.main-input:focus { border-color: #ffd89b; background: rgba(0,0,0,0.4); }

.main-select { width: 100%; padding: 14px 18px; border-radius: 12px; background: rgba(0,0,0,0.2); color: white; border: 1px solid var(--glass-border); outline: none; cursor: pointer; appearance: none; font-weight: 600; font-size: 15px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 15px center; background-size: 18px; transition: 0.3s; box-sizing: border-box;}
.main-select option { background: #1e1b4b; color: white; }
.main-select:focus { border-color: #ffd89b; }

/* Dashboard Grid Layout */
.dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
.panel { background: rgba(0,0,0,0.15); border-radius: 25px; padding: 25px; border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 20px; }
.panel-full { grid-column: 1 / -1; }
.panel-title { font-size: 1.3em; font-weight: 700; color: #ffd89b; margin: 0; display: flex; align-items: center; gap: 10px; }

/* Primary Color Picker Section */
.master-picker-wrap { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; }
.color-preview-large { width: 120px; height: 120px; border-radius: 25px; border: 4px solid rgba(255,255,255,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden; flex-shrink: 0;}
.color-preview-large input[type="color"] { position: absolute; top: -10px; left: -10px; width: 150px; height: 150px; cursor: pointer; opacity: 0; }
.master-controls { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 200px; }

/* Quick Formats Grid */
.format-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
.format-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.06); padding: 12px 18px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
.format-label { font-weight: 700; font-size: 0.9em; opacity: 0.7; width: 50px; }
.format-value { font-family: monospace; font-size: 1.1em; flex: 1; margin: 0 15px; user-select: all; }

/* Palette Generator */
.palette-container { display: flex; gap: 15px; height: 100px; }
.swatch-wrap { flex: 1; display: flex; flex-direction: column; gap: 8px; transition: 0.3s; cursor: pointer; }
.swatch-wrap:hover { transform: translateY(-5px); }
.swatch { flex: 1; border-radius: 15px; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s; }
.swatch-hex { text-align: center; font-family: monospace; font-size: 0.9em; font-weight: 600; letter-spacing: 1px; }

/* Contrast Checker (Redesigned) */
.contrast-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.contrast-item { display: flex; flex-direction: column; gap: 12px; }
.contrast-block { border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: background-color 0.3s; min-height: 80px; }
.contrast-text { font-size: 3.5em; font-weight: 700; margin: 0; line-height: 1; }
.contrast-info { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 12px 18px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
.contrast-badge { font-size: 0.8em; font-weight: 700; padding: 5px 12px; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; }
.badge-pass { background: rgba(144, 238, 144, 0.2); color: #90ee90; border: 1px solid rgba(144,238,144,0.4); }
.badge-fail { background: rgba(255, 99, 71, 0.2); color: #ff6347; border: 1px solid rgba(255,99,71,0.4); }

/* Custom Converter */
.converter-body { display: flex; flex-direction: column; gap: 15px; }
.converter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.output-box { text-align: center; font-family: monospace; font-size: 1.3em; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); color: #ffd89b; font-weight: 700; word-break: break-all; min-height: 25px;}

@media (max-width: 850px) {
    .dashboard { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; gap: 15px; }
    .palette-container { height: 80px; }
    .swatch-hex { font-size: 0.7em; }
}
</style>
</head>
<body>

<div class="container animate-in">
    <!-- HEADER -->
    <div class="header">
        <div>
            <h1>Colorful Tools <span class="version-tag">v2</span></h1>
            <p class="credits">Made by Dawidolowid</p>
        </div>
        <div>
            <a href="/webtools/" class="btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to Hub</a>
        </div>
    </div>

    <div class="dashboard">
        <!-- 1. MASTER PICKER -->
        <div class="panel">
            <h2 class="panel-title"><i class="fa-solid fa-eye-dropper"></i> Master Color</h2>
            <div class="master-picker-wrap">
                <div class="color-preview-large" id="mainPreview" style="background-color: #667eea;">
                    <input type="color" id="colorPicker" value="#667eea" oninput="handleMasterChange(event)">
                </div>
                <div class="master-controls">
                    <input type="text" id="hexInput" class="main-input" placeholder="e.g. #667EEA" value="#667EEA" onchange="handleInputChange(event)">
                    <button class="btn-main" onclick="triggerRandomColor()"><i class="fa-solid fa-dice"></i> Random Color</button>
                </div>
            </div>
        </div>

        <!-- 2. QUICK FORMATS -->
        <div class="panel">
            <h2 class="panel-title"><i class="fa-solid fa-code"></i> CSS Formats</h2>
            <div class="format-list">
                <div class="format-row" id="row-rgb">
                    <div class="format-label">RGB</div>
                    <div class="format-value" id="val-rgb">rgb(102, 126, 234)</div>
                    <button class="icon-btn" style="width: 38px; height: 38px;" onclick="copyText('val-rgb', 'row-rgb')" title="Copy RGB"><i class="fa-solid fa-copy"></i></button>
                </div>
                <div class="format-row" id="row-hsl">
                    <div class="format-label">HSL</div>
                    <div class="format-value" id="val-hsl">hsl(229, 74%, 66%)</div>
                    <button class="icon-btn" style="width: 38px; height: 38px;" onclick="copyText('val-hsl', 'row-hsl')" title="Copy HSL"><i class="fa-solid fa-copy"></i></button>
                </div>
                <div class="format-row" id="row-hsv">
                    <div class="format-label">HSV</div>
                    <div class="format-value" id="val-hsv">hsv(229, 56%, 92%)</div>
                    <button class="icon-btn" style="width: 38px; height: 38px;" onclick="copyText('val-hsv', 'row-hsv')" title="Copy HSV"><i class="fa-solid fa-copy"></i></button>
                </div>
            </div>
        </div>

        <!-- 3. HARMONY PALETTE -->
        <div class="panel panel-full">
            <h2 class="panel-title"><i class="fa-solid fa-swatchbook"></i> Palette Generator</h2>
            <div class="palette-container">
                <!-- Swatches generated by JS -->
                <div class="swatch-wrap" onclick="copySwatch(0)"><div class="swatch" id="swatch-0"></div><div class="swatch-hex" id="swatch-lbl-0">#...</div></div>
                <div class="swatch-wrap" onclick="copySwatch(1)"><div class="swatch" id="swatch-1"></div><div class="swatch-hex" id="swatch-lbl-1">#...</div></div>
                <div class="swatch-wrap" onclick="copySwatch(2)"><div class="swatch" id="swatch-2"></div><div class="swatch-hex" id="swatch-lbl-2">#...</div></div>
                <div class="swatch-wrap" onclick="copySwatch(3)"><div class="swatch" id="swatch-3"></div><div class="swatch-hex" id="swatch-lbl-3">#...</div></div>
                <div class="swatch-wrap" onclick="copySwatch(4)"><div class="swatch" id="swatch-4"></div><div class="swatch-hex" id="swatch-lbl-4">#...</div></div>
            </div>
        </div>

        <!-- 4. CONTRAST CHECKER -->
        <div class="panel">
            <h2 class="panel-title"><i class="fa-solid fa-adjust"></i> WCAG Contrast Check</h2>
            <div class="contrast-grid">
                <!-- White Text Block -->
                <div class="contrast-item">
                    <div class="contrast-block" id="block-white" style="color: white;">
                        <p class="contrast-text">Aa</p>
                    </div>
                    <div class="contrast-info">
                        <span style="font-size:0.95em; font-weight: 600;">White Text</span>
                        <div class="contrast-badge" id="badge-white">PASS</div>
                    </div>
                </div>
                <!-- Black Text Block -->
                <div class="contrast-item">
                    <div class="contrast-block" id="block-black" style="color: black;">
                        <p class="contrast-text">Aa</p>
                    </div>
                    <div class="contrast-info">
                        <span style="font-size:0.95em; font-weight: 600;">Black Text</span>
                        <div class="contrast-badge" id="badge-black">FAIL</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. FORMAT CONVERTER -->
        <div class="panel">
            <h2 class="panel-title"><i class="fa-solid fa-shuffle"></i> Any-to-Any Converter</h2>
            <div class="converter-body">
                <div class="converter-row">
                    <select id="convFrom" class="main-select" onchange="runConverter()">
                        <option value="hex">From: HEX</option>
                        <option value="rgb">From: RGB</option>
                        <option value="hsl">From: HSL</option>
                        <option value="decimal">From: Decimal</option>
                    </select>
                    <select id="convTo" class="main-select" onchange="runConverter()">
                        <option value="rgb">To: RGB</option>
                        <option value="hex" selected>To: HEX</option>
                        <option value="hsl">To: HSL</option>
                        <option value="hsv">To: HSV</option>
                        <option value="decimal">To: Decimal</option>
                    </select>
                </div>
                <div style="display: flex; gap:10px;">
                    <input type="text" id="convInput" class="main-input" placeholder="Type value to convert..." oninput="runConverter()">
                    <!-- Enlarged download icon for pulling from Master -->
                    <button class="icon-btn" style="font-size: 1.5em; width: 52px;" onclick="pullFromMaster()" title="Use Master Color"><i class="fa-solid fa-arrow-down"></i></button>
                </div>
                <div class="output-box" id="convOutput">-</div>
            </div>
        </div>
    </div>
</div>

<script>
/* --- MATH HELPER FUNCTIONS --- */
function hexToRgb(hex) {
    hex = hex.replace(/^#/, '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const r = /^([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return r ? { r: parseInt(r[1], 16), g: parseInt(r[2], 16), b: parseInt(r[3], 16) } : null;
}

function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join("").toUpperCase();
}

function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h, s, l = (max + min) / 2;
    if (max === min) h = s = 0;
    else {
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
}

function hslToRgb(h, s, l) {
    h /= 360; s /= 100; l /= 100;
    const k = n => (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return { r: Math.round(255 * f(0)), g: Math.round(255 * f(8)), b: Math.round(255 * f(4)) };
}

function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0, s = max === 0 ? 0 : d / max, v = max;
    if (max !== min) {
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), v: Math.round(v * 100) };
}

/* WCAG LUMINANCE & CONTRAST */
function getLuminance(r, g, b) {
    const a = [r, g, b].map(v => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
}

function getContrastRatio(l1, l2) {
    const lighter = Math.max(l1, l2);
    const darker = Math.min(l1, l2);
    return (lighter + 0.05) / (darker + 0.05);
}

/* --- CORE STATE MANAGEMENT --- */
let currentRgb = { r: 102, g: 126, b: 234 };

function applyColorToUI(rgb) {
    currentRgb = rgb;
    const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
    const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
    const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);

    // Update Master Picker UI
    document.getElementById("colorPicker").value = hex;
    document.getElementById("mainPreview").style.backgroundColor = hex;
    document.getElementById("hexInput").value = hex;

    // Update Quick Formats
    document.getElementById("val-rgb").textContent = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
    document.getElementById("val-hsl").textContent = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
    document.getElementById("val-hsv").textContent = `hsv(${hsv.h}, ${hsv.s}%, ${hsv.v}%)`;

    // Update Contrast Checker
    updateContrastChecker(rgb.r, rgb.g, rgb.b, hex);

    // Update Palette
    updatePalette(hsl.h, hsl.s, hsl.l);
}

function handleMasterChange(e) {
    const rgb = hexToRgb(e.target.value);
    if(rgb) applyColorToUI(rgb);
}

function handleInputChange(e) {
    let val = e.target.value.trim();
    if(!val.startsWith('#') && val.length >= 3) val = '#' + val;
    const rgb = hexToRgb(val);
    if(rgb) applyColorToUI(rgb);
}

function triggerRandomColor() {
    const r = Math.floor(Math.random() * 256);
    const g = Math.floor(Math.random() * 256);
    const b = Math.floor(Math.random() * 256);
    applyColorToUI({r, g, b});
}

/* --- TOOL: CONTRAST CHECKER --- */
function updateContrastChecker(r, g, b, hex) {
    const bgLuminance = getLuminance(r, g, b);
    const whiteLuminance = getLuminance(255, 255, 255);
    const blackLuminance = getLuminance(0, 0, 0);

    const ratioWhite = getContrastRatio(whiteLuminance, bgLuminance);
    const ratioBlack = getContrastRatio(bgLuminance, blackLuminance);

    // Target UI Blocks
    const blockWhite = document.getElementById("block-white");
    const blockBlack = document.getElementById("block-black");
    const badgeWhite = document.getElementById("badge-white");
    const badgeBlack = document.getElementById("badge-black");

    blockWhite.style.backgroundColor = hex;
    blockBlack.style.backgroundColor = hex;

    // Using 3.0 ratio threshold (WCAG AA Large Text / UI Components - much more forgiving)
    if(ratioWhite >= 3.0) { 
        badgeWhite.textContent = `PASS (${ratioWhite.toFixed(1)})`; 
        badgeWhite.className = "contrast-badge badge-pass"; 
    } else { 
        badgeWhite.textContent = `FAIL (${ratioWhite.toFixed(1)})`; 
        badgeWhite.className = "contrast-badge badge-fail"; 
    }

    if(ratioBlack >= 3.0) { 
        badgeBlack.textContent = `PASS (${ratioBlack.toFixed(1)})`; 
        badgeBlack.className = "contrast-badge badge-pass"; 
    } else { 
        badgeBlack.textContent = `FAIL (${ratioBlack.toFixed(1)})`; 
        badgeBlack.className = "contrast-badge badge-fail"; 
    }
}

/* --- TOOL: PALETTE GENERATOR --- */
function updatePalette(h, s, l) {
    // We generate an Analogous + Complementary hybrid palette
    const hues = [
        (h + 330) % 360, // Analogous left
        h,               // Base
        (h + 30) % 360,  // Analogous right
        (h + 180) % 360, // Complementary
        (h + 150) % 360  // Split complementary
    ];

    hues.forEach((hue, index) => {
        const rgb = hslToRgb(hue, s, l);
        const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
        const swatch = document.getElementById(`swatch-${index}`);
        const label = document.getElementById(`swatch-lbl-${index}`);
        
        swatch.style.backgroundColor = hex;
        label.textContent = hex;
        swatch.dataset.hex = hex; // store for copying
    });
}

/* --- FORMAT CONVERTER --- */
function runConverter() {
    const from = document.getElementById("convFrom").value;
    const to = document.getElementById("convTo").value;
    const input = document.getElementById("convInput").value.trim();
    const out = document.getElementById("convOutput");

    if(!input) { out.textContent = "-"; return; }

    let rgb = null;
    const nums = input.match(/\d+/g);

    try {
        if (from === "hex") rgb = hexToRgb(input.startsWith("#") ? input : "#" + input);
        else if (from === "decimal" && nums) {
            let h = parseInt(nums[0]).toString(16);
            rgb = hexToRgb("#" + h.padStart(6, '0'));
        } else if (nums && nums.length >= 3) {
            let v1 = parseInt(nums[0]), v2 = parseInt(nums[1]), v3 = parseInt(nums[2]);
            if (from === "rgb") rgb = { r: v1, g: v2, b: v3 };
            else if (from === "hsl") rgb = hslToRgb(v1, v2, v3);
        }

        if (!rgb || isNaN(rgb.r)) { out.textContent = "Invalid Input"; return; }

        let res = "";
        if (to === "hex") res = rgbToHex(rgb.r, rgb.g, rgb.b);
        else if (to === "rgb") res = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        else if (to === "hsl") { const h = rgbToHsl(rgb.r, rgb.g, rgb.b); res = `hsl(${h.h}, ${h.s}%, ${h.l}%)`; }
        else if (to === "hsv") { const h = rgbToHsv(rgb.r, rgb.g, rgb.b); res = `hsv(${h.h}, ${h.s}%, ${h.v}%)`; }
        else if (to === "decimal") res = (rgb.r << 16) + (rgb.g << 8) + rgb.b;

        out.textContent = res;
    } catch(e) { out.textContent = "Error parsing value"; }
}

function pullFromMaster() {
    const from = document.getElementById("convFrom").value;
    const inp = document.getElementById("convInput");
    
    if(from === "hex") inp.value = rgbToHex(currentRgb.r, currentRgb.g, currentRgb.b);
    else if(from === "rgb") inp.value = `${currentRgb.r}, ${currentRgb.g}, ${currentRgb.b}`;
    else if(from === "hsl") { const h = rgbToHsl(currentRgb.r, currentRgb.g, currentRgb.b); inp.value = `${h.h}, ${h.s}, ${h.l}`; }
    else if(from === "decimal") inp.value = (currentRgb.r << 16) + (currentRgb.g << 8) + currentRgb.b;
    
    runConverter();
}

/* --- UTILITIES --- */
function copyText(valId, wrapperId = null) {
    const text = document.getElementById(valId).textContent;
    navigator.clipboard.writeText(text);
    
    if(wrapperId) {
        const wrap = document.getElementById(wrapperId);
        wrap.classList.remove('flash-copy');
        void wrap.offsetWidth;
        wrap.classList.add('flash-copy');
    }
}

function copySwatch(index) {
    const swatch = document.getElementById(`swatch-${index}`);
    navigator.clipboard.writeText(swatch.dataset.hex);
    
    swatch.classList.remove('flash-border');
    void swatch.offsetWidth;
    swatch.classList.add('flash-border');
}

// Init execution
applyColorToUI(currentRgb);

</script>
