<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5; url=https://your-new-redtracker-url.com">
    <title>Updating RedTracker | WebTools</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            --warning: #f87171;
        }

        body {
            font-family: "Outfit", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent);
            z-index: 10;
        }

        .redirect-container {
            max-width: 500px;
            width: 90%;
            padding: 40px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 35px;
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        .icon-stack {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .icon-main { font-size: 3.5rem; color: #ffd89b; }
        .icon-sub { font-size: 1.5rem; color: var(--warning); align-self: flex-end; }

        .badge-outdated {
            background: rgba(239, 68, 68, 0.15); 
            color: var(--warning); 
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 { font-size: 2.2rem; margin: 0 0 10px 0; letter-spacing: -1px; color: #ffd89b; }
        .info-text { opacity: 0.85; line-height: 1.6; margin-bottom: 25px; font-size: 1.05rem; }

        .loader-container {
            background: rgba(0, 0, 0, 0.3);
            height: 8px;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            animation: progress 5s linear forwards;
        }

        .btn-action {
            display: inline-flex;
            align-items: center; gap: 12px;
            padding: 14px 28px;
            background: var(--accent);
            border-radius: 18px;
            color: white; font-weight: 700;
            text-decoration: none; transition: 0.3s;
        }

        .btn-action:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
    </style>
</head>
<body>

    <div class="redirect-container">
        <div class="icon-stack">
            <i class="fa-solid fa-droplet icon-main"></i>
            <i class="fa-solid fa-clock-rotate-left icon-sub"></i>
        </div>

        <span class="badge-outdated" id="badgeText"></span>
        <h1 id="titleText"></h1>
        <p class="info-text" id="descText"></p>
        
        <div class="loader-container">
            <div class="loader-bar"></div>
        </div>

        <a href="https://wrt-dawidolowid.github.io/webtools/tools/redtracker-v3.html" class="btn-action">
            <i class="fa-solid fa-rocket"></i>
            <span id="btnText"></span>
        </a>
    </div>

    <script>
        const translations = {
            en: {
                title: "RedTracker is Loading",
                badge: '<i class="fa-solid fa-triangle-exclamation"></i> Outdated Version',
                desc: "This version of <b>RedTracker</b> is no longer supported. We are moving you to the latest version with improved prediction mechanisms.",
                btn: "Launch New Version"
            },
            pl: {
                title: "RedTracker się ładuje",
                badge: '<i class="fa-solid fa-triangle-exclamation"></i> Nieaktualna wersja',
                desc: "Ta wersja <b>RedTracker</b> nie jest już wspierana. Przenosimy Cię do najnowszej wersji z ulepszonymi mechanizmami przewidywania.",
                btn: "Uruchom nową wersję"
            }
        };

        function getLanguagePreference() {
            // Check for the settings object you defined in redtracker.html
            const savedSettings = localStorage.getItem('redtracker_settings');
            if (savedSettings) {
                try {
                    const settings = JSON.parse(savedSettings);
                    // Adjust 'pl' if your program uses a different key for Polish
                    if (settings.language === 'pl' || settings.lang === 'pl') return 'pl';
                } catch(e) { console.error("Could not parse settings"); }
            }
            return 'en'; // Default
        }

        const lang = getLanguagePreference();

        // Apply translations
        document.getElementById('titleText').innerText = translations[lang].title;
        document.getElementById('badgeText').innerHTML = translations[lang].badge;
        document.getElementById('descText').innerHTML = translations[lang].desc;
        document.getElementById('btnText').innerText = translations[lang].btn;

        // Redirect timer
        setTimeout(() => {
            window.location.href = "https://wrt-dawidolowid.github.io/webtools/tools/redtracker-v3.html";
        }, 5000);
    </script>
</body>
</html>
